name: Check travel app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements-lock.txt
      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile
      - name: Verify browser/server boundaries
        run: .venv/bin/python tools/check_boundaries.py
      - name: Test backend
        run: .venv/bin/python -m pytest backend/tests -q
      - name: Verify generated API contract
        run: |
          .venv/bin/python -m backend.export_openapi
          cd frontend
          node node_modules/orval/dist/bin/orval.mjs --config orval.config.ts
          cd ..
          git diff --exit-code -- contracts/openapi.json frontend/src/api/generated
      - name: Build frontend
        run: cd frontend && bun run build
      - name: Install test browser
        run: cd frontend && node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Start local API and web app
        run: |
          python tools/dev.py > /tmp/map-5-dev.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501 > /dev/null && curl --fail --silent http://127.0.0.1:8001/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/map-5-dev.log
          exit 1
      - name: Check customer flows
        run: cd frontend && node node_modules/@playwright/test/cli.js test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: travel-check-evidence
          path: |
            frontend/test-results
            frontend/e2e/artifacts
