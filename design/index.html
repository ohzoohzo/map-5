<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PinDay — 화면과 여정 검토</title>
  <style>
    :root{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#142b49;background:#f4f7fb;font-synthesis:none;line-height:1.6}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #f27c4a;outline-offset:4px}header{background:#fff;border-bottom:1px solid #dfe7f0;padding:20px max(20px,calc((100vw - 1400px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:24px;margin:0;letter-spacing:-.7px}header p{font-size:13px;margin:0;color:#52677e}.badge{border-radius:6px;padding:4px 9px;font-size:12px;background:#e7f1ff;color:#1557a7}main{max-width:1440px;margin:auto;padding:24px 20px 40px}.intro{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}.intro p{margin:0;font-size:14px;color:#4e637c}.links{display:flex;gap:14px;font-size:13px}.links a{color:#1557a7}.journey{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}.journey button{border:1px solid #d7e3ef;background:#fff;border-radius:9px;padding:11px 14px;color:#425a72;min-height:44px}.journey button[aria-selected=true]{background:#1557a7;border-color:#1557a7;color:white}.journey small{display:block;opacity:.8;font-size:11px}.content{display:grid;grid-template-columns:255px minmax(0,1fr);gap:20px;align-items:start}.contract{background:#fff;padding:22px;border:1px solid #dfe7f0;border-radius:12px}.contract h2{font-size:19px;line-height:1.4;margin:0 0 8px}.contract .stage{font-size:11px;font-weight:700;color:#217b88;letter-spacing:1px;margin:0 0 10px}.contract dl{margin:20px 0 0}.contract dt{font-size:12px;color:#61718a;font-weight:700;margin-top:18px}.contract dd{font-size:14px;margin:4px 0 0}.contract .notice{border-top:1px solid #e5ecf3;margin-top:20px;padding-top:16px;font-size:12px;color:#5b6c81}.image-box{background:#fff;border:1px solid #dfe7f0;border-radius:12px;padding:10px;overflow:hidden}.image-box a{display:block}.image-box img{width:100%;height:auto;display:block;border-radius:7px}.caption{font-size:12px;margin:10px 4px 3px;color:#536780}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:16px}.controls button{border:1px solid #c9d9ea;background:white;border-radius:8px;padding:10px 16px;min-height:44px;color:#1a416d}.controls button:disabled{opacity:.35;cursor:default}.counter{font-size:13px;color:#61718a}footer{font-size:12px;color:#61718a;margin-top:28px;border-top:1px solid #dce5ef;padding-top:16px}@media(max-width:800px){header{align-items:flex-start;padding:18px 20px}.intro{align-items:flex-start;flex-direction:column;gap:8px}.content{grid-template-columns:1fr}.contract{padding:18px}.contract dl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.contract dt{margin-top:0}.contract dl>div{min-width:0}.contract .notice{margin-top:12px;padding-top:12px}.journey{gap:6px}.journey button{padding:9px 10px;font-size:12px}h1{font-size:20px}.links{flex-wrap:wrap}}
  </style>
</head>
<body>
  <header><div><h1>PinDay <span class="badge">기획 시안</span></h1><p>같은 여행을 유지하며 이어지는 일곱 화면</p></div><span class="badge">부산 · 2박 3일</span></header>
  <main>
    <div class="intro"><p>화면을 골라 주 행동과 다음 전환을 확인하세요. 이미지를 누르면 원본 크기로 열립니다.</p><div class="links"><a href="PinDay-여정-정보구조.md">여정·정보 구조</a><a href="https://github.com/ohzoohzo/map-5">GitHub 레포</a></div></div>
    <nav class="journey" role="tablist" aria-label="시안 화면 선택" id="tabs"></nav>
    <div class="content">
      <section class="contract" id="contract" role="tabpanel" aria-labelledby="tab-home" aria-live="polite"></section>
      <section><div class="image-box"><a id="image-link" target="_blank" rel="noopener"><img id="screen-image" alt=""><p class="caption" id="caption"></p></a></div><div class="controls"><button id="previous">이전 화면</button><span class="counter" id="counter"></span><button id="next">다음 화면</button></div></section>
    </div>
    <footer>이미지는 built-in image_gen으로 만든 UI 기획 초안입니다. 장소·날씨·해설·경로·테스트 결과는 예시이며 실제 연동 화면이 아닙니다. 지도·후보·일정의 기본 코드와 새로운 기능의 설계 상태를 구분합니다.</footer>
  </main>
  <script>
    const screens=[
      {id:'home',name:'홈',phase:'여행 시작',file:'pinday-home-v3.png',goal:'어디로 언제 여행할지 정해요.',action:'내 여행 시작하기',next:'어디 갈까? 장소 탐색',keep:'목적지·날짜·취향',hint:'성향 테스트와 랜덤 뽑기는 건너뛸 수 있는 선택 경로예요.'},
      {id:'taste',name:'나의 여행 테스트',phase:'선택 경로',file:'pinday-taste-v2.png',goal:'내가 좋아하는 여행의 리듬을 알아봐요.',action:'이 취향으로 장소 찾기',next:'취향 필터가 적용된 장소 탐색',keep:'이미 만든 여행과 저장한 장소',hint:'결과는 가벼운 취향 안내이며 심리 진단이 아니에요.'},
      {id:'explore',name:'어디 갈까?',phase:'장소 발견',file:'pinday-explore-v2.png',goal:'관광지·맛집·카페·쇼핑 장소를 후보로 모아요.',action:'후보함에 저장',next:'언제 갈까? 날짜별 배치',keep:'검색·동네 필터·기존 일정',hint:'후보를 저장하는 것과 날짜에 배치하는 것은 다른 행동이에요.'},
      {id:'planner',name:'언제 갈까?',phase:'날짜별 일정',file:'pinday-planner-docent-v3.png',goal:'후보를 원하는 DAY와 방문 순서에 배치해요.',action:'이 날짜에 추가 · 순서 변경',next:'구간별 이동·날씨 확인',keep:'후보함·다른 날짜·메모',hint:'시안은 장소 해설을 열어도 원래 DAY와 일정이 유지되는 상태예요.'},
      {id:'transport',name:'어떻게 갈까?',phase:'이동 확인',file:'pinday-transport-v2.png',goal:'일정 속 두 장소 사이의 이동을 확인해요.',action:'카카오맵에서 이 구간 길찾기',next:'기존 DAY의 일정으로 복귀',keep:'출발·도착 장소·DAY·방문 순서',hint:'지도 선은 위치 예시예요. 검증된 경로 정보 없이 시간·요금을 만들지 않아요.'},
      {id:'weather',name:'날씨 대안',phase:'한 장소 조정',file:'pinday-weather-v2.png',goal:'영향받는 한 장소의 대안을 비교해요.',action:'이 장소로 교체하기',next:'바뀐 한 항목이 반영된 일정',keep:'DAY·시각·나머지 장소·메모',hint:'일정 전체를 다시 만들지 않고 교체 전에 미리보기를 보여줘요.'},
      {id:'docent',name:'AI 도슨트',phase:'장소·지역 이해',file:'pinday-docent-v2.png',goal:'선택한 동네의 이야기와 최근 소식을 근거와 함께 읽어요.',action:'해설 보기 · 원래 일정으로',next:'진입한 화면·선택 상태 복원',keep:'장소 ID·DAY·마커·스크롤',hint:'역사 근거와 뉴스의 발행일·출처를 구분해요.'}
    ];
    let selected=0;
    const tabs=document.getElementById('tabs');
    screens.forEach((screen,index)=>{const button=document.createElement('button');button.type='button';button.role='tab';button.id='tab-'+screen.id;button.textContent=screen.name;button.setAttribute('aria-controls','contract');button.addEventListener('click',()=>render(index,true));tabs.appendChild(button)});
    function element(tag,text){const node=document.createElement(tag);node.textContent=text;return node}
    function render(index,updateHash=false){selected=index;const screen=screens[index];[...tabs.children].forEach((button,i)=>{button.setAttribute('aria-selected',String(i===index));button.tabIndex=i===index?0:-1});const contract=document.getElementById('contract');contract.setAttribute('aria-labelledby','tab-'+screen.id);contract.replaceChildren();contract.appendChild(element('p',screen.phase)).className='stage';contract.appendChild(element('h2',screen.name));contract.appendChild(element('p',screen.goal));const list=document.createElement('dl');for(const [label,value] of [['주 행동',screen.action],['다음 전환',screen.next],['유지되는 정보',screen.keep]]){const row=document.createElement('div');row.append(element('dt',label),element('dd',value));list.append(row)}contract.append(list);contract.appendChild(element('p',screen.hint)).className='notice';document.getElementById('image-link').href=screen.file;const image=document.getElementById('screen-image');image.src=screen.file;image.alt='PinDay '+screen.name+' 기획 화면';document.getElementById('caption').textContent=screen.name+' · '+screen.phase+' · 예시 데이터';document.getElementById('counter').textContent=(index+1)+' / '+screens.length;document.getElementById('previous').disabled=index===0;document.getElementById('next').disabled=index===screens.length-1;if(updateHash)history.replaceState(null,'','#'+screen.id)}
    document.getElementById('previous').onclick=()=>render(Math.max(0,selected-1),true);document.getElementById('next').onclick=()=>render(Math.min(screens.length-1,selected+1),true);
    tabs.addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?screens.length-1:(selected+(event.key==='ArrowRight'?1:-1)+screens.length)%screens.length;render(next,true);tabs.children[next].focus()});
    function renderFromHash(){const index=screens.findIndex(screen=>screen.id===location.hash.slice(1));render(index<0?0:index)}
    window.addEventListener('hashchange',renderFromHash);
    renderFromHash();
  </script>
</body>
</html>
