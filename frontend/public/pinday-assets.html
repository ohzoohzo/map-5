<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PinDay 이미지 에셋</title>
<style>
  *{box-sizing:border-box}body{font:15px/1.6 system-ui,-apple-system,sans-serif;margin:0;color:#142b49;background:#f5f8fb}main{max-width:1180px;margin:auto;padding:32px 20px 60px}h1{font-size:28px;margin:0}p{margin:8px 0 24px;color:#536981}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}figure{margin:0;border:1px solid #dce6ef;border-radius:14px;overflow:hidden;background:white}a{display:block;outline-offset:-4px}img{display:block;width:100%;height:250px;object-fit:contain;background-color:#fff;background-image:linear-gradient(45deg,#f0f4f8 25%,transparent 25%),linear-gradient(-45deg,#f0f4f8 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f0f4f8 75%),linear-gradient(-45deg,transparent 75%,#f0f4f8 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}figcaption{padding:14px 16px}strong{display:block}small{color:#60788d}.wide{grid-column:1/-1}.wide img{height:auto;max-height:400px;object-fit:cover;background:none}.portrait{grid-column:span 2}.portrait img{height:360px}.note{margin-top:28px;border-top:1px solid #dce6ef;padding-top:20px;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}img{height:200px}.portrait img{height:300px}h1{font-size:24px}}
</style>
<main>
  <h1>PinDay · 이미지 에셋 7종</h1>
  <p>홈·성향 테스트·랜덤 뽑기에 쓰는 생성 일러스트입니다. 이미지를 누르면 원본으로 열립니다.</p>
  <div class="grid">
    <figure class="wide"><a href="/images/pinday/busan-hero.png"><img src="/images/pinday/busan-hero.png" alt="부산 해안 분위기의 파노라마 일러스트"></a><figcaption><strong>홈 메인 비주얼</strong><small>busan-hero.png · 텍스트 영역은 왼쪽</small></figcaption></figure>
    <figure><a href="/images/pinday/taste-slow-alley.png"><img src="/images/pinday/taste-slow-alley.png" alt="지도와 함께 골목을 걷는 여행자"></a><figcaption><strong>느긋한 골목 탐험가</strong><small>taste-slow-alley.png · 투명 배경</small></figcaption></figure>
    <figure><a href="/images/pinday/taste-sea-healing.png"><img src="/images/pinday/taste-sea-healing.png" alt="해변 의자에서 쉬는 여행자"></a><figcaption><strong>바다 보며 쉬는 힐링러</strong><small>taste-sea-healing.png · 투명 배경</small></figcaption></figure>
    <figure><a href="/images/pinday/taste-culture.png"><img src="/images/pinday/taste-culture.png" alt="전시를 감상하며 기록하는 여행자"></a><figcaption><strong>알찬 문화 수집가</strong><small>taste-culture.png · 투명 배경</small></figcaption></figure>
    <figure><a href="/images/pinday/taste-active.png"><img src="/images/pinday/taste-active.png" alt="해안 산책로를 걷는 배낭 여행자"></a><figcaption><strong>부지런한 액티브 탐험가</strong><small>taste-active.png · 투명 배경</small></figcaption></figure>
    <figure class="portrait"><a href="/images/pinday/coastal-train.png"><img src="/images/pinday/coastal-train.png" alt="푸른 바다 옆을 달리는 열차 일러스트"></a><figcaption><strong>홈 여행 스타일 카드</strong><small>coastal-train.png · 세로 배경</small></figcaption></figure>
    <figure class="portrait"><a href="/images/pinday/travel-random.png"><img src="/images/pinday/travel-random.png" alt="지도와 파란 핀, 주사위 일러스트"></a><figcaption><strong>여행지 랜덤 뽑기</strong><small>travel-random.png · 투명 배경</small></figcaption></figure>
  </div>
  <p class="note">built-in image_gen으로 생성한 장식용 이미지입니다. 실제 장소 카드의 사진은 출처·이용 조건을 확인한 관광 사진으로 연결합니다.</p>
</main>
</html>
